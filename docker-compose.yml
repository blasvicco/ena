services:
  ena_experiment:
    build:
      context: ./
      dockerfile: hub/python/Dockerfile
    volumes:
      - ./app:/home/app
    ports:
      - "8501:8501"
    command: ["tail", "-f", "/dev/null"]
    container_name: ena-experiment
    working_dir: /home/app
  paper:
    image: texlive/texlive:latest
    volumes:
      - ./app/latex:/workdir
    command: ["tail", "-f", "/dev/null"]
    container_name: ena-paper
    working_dir: /workdir
